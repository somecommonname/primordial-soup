<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primordial Soup</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050A14">
<style>
  :root{
    --abyss:#050A14; --deep:#04070F; --ink:#C9D8EA; --dim:#5F7391;
    --cyan:#63E2FF; --algae:#6FE08A; --danger:#FF6B5E;
    --panel:rgba(8,14,26,0.78); --line:rgba(99,140,190,0.16);
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--abyss);color:var(--ink);font-family:var(--mono);overflow:hidden;
       font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  canvas#dish{position:fixed;inset:0;display:block}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;
         backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px;
         box-shadow:0 8px 40px rgba(0,0,0,0.5)}
  #tools{left:18px;top:18px;width:228px}
  #report{right:18px;top:18px;width:264px}
  h1{font-size:15px;font-weight:600;letter-spacing:0.28em;color:var(--cyan)}
  .sub{font-size:10px;color:var(--dim);letter-spacing:0.12em;margin:3px 0 12px}
  .ptitle{font-size:9px;letter-spacing:0.22em;color:var(--dim);margin:14px 0 7px}
  .ptitle:first-child{margin-top:0}
  .row{display:flex;gap:6px}
  button{font-family:var(--mono);font-size:11px;color:var(--ink);background:rgba(99,226,255,0.05);
         border:1px solid var(--line);border-radius:7px;padding:7px 8px;cursor:pointer;
         letter-spacing:0.04em;transition:background .15s,border-color .15s}
  button:hover{background:rgba(99,226,255,0.12)}
  button:focus-visible{outline:1px solid var(--cyan);outline-offset:1px}
  button.on{background:rgba(99,226,255,0.16);border-color:var(--cyan);color:var(--cyan)}
  button.warn:hover{border-color:var(--danger);color:var(--danger)}
  button:disabled{opacity:0.4;cursor:default}
  .toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .toolgrid button,.wide{width:100%;text-align:left}
  .wide{margin-top:14px}
  .seg{display:flex;flex:1}
  .seg button{flex:1;border-radius:0;border-right-width:0}
  .seg button:first-child{border-radius:7px 0 0 7px}
  .seg button:last-child{border-radius:0 7px 7px 0;border-right-width:1px}
  .dial{margin-bottom:10px}
  .dial label{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:4px}
  .dial label b{color:var(--ink);font-weight:400}
  input[type=range]{width:100%;accent-color:var(--cyan);height:18px}
  .bignums{display:flex;gap:18px;margin-bottom:6px}
  .bignums span{font-size:26px;color:var(--ink)}
  .bignums .alg span{color:var(--algae)}
  .bignums label{display:block;font-size:9px;letter-spacing:0.18em;color:var(--dim)}
  .subnums{font-size:10px;color:var(--dim);margin-bottom:10px}
  .subnums b{color:var(--ink);font-weight:400}
  #popChart{width:100%;height:64px;display:block;margin-bottom:2px}
  .spark{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:10px}
  .spark .lbl{width:44px;color:var(--dim)}
  .spark .val{width:44px;text-align:right;color:var(--ink)}
  .spark canvas{width:110px;height:22px;flex:1}
  #inspector{left:50%;bottom:18px;transform:translateX(-50%);width:300px;display:none}
  #inspector.show{display:block}
  #inspector .name{font-size:13px;color:var(--cyan);letter-spacing:0.08em}
  #inspector .meta{font-size:10px;color:var(--dim);margin:2px 0 8px}
  #inspector .close{position:absolute;right:8px;top:8px;border:none;background:none;color:var(--dim);font-size:13px;padding:2px 6px}
  .ebar{height:5px;background:rgba(99,140,190,0.15);border-radius:3px;margin-bottom:10px;overflow:hidden}
  .ebar i{display:block;height:100%;background:var(--cyan);border-radius:3px;transition:width .2s}
  .gene{display:flex;align-items:center;gap:8px;font-size:9.5px;margin-bottom:4px}
  .gene .lbl{width:56px;color:var(--dim);letter-spacing:0.06em}
  .gene .bar{flex:1;height:4px;background:rgba(99,140,190,0.15);border-radius:2px;overflow:hidden}
  .gene .bar i{display:block;height:100%;border-radius:2px;background:var(--ink)}
  .gene.diet .bar i{background:linear-gradient(90deg,var(--algae),var(--danger))}
  #ticker{position:fixed;left:18px;bottom:16px;font-size:10.5px;color:var(--dim);pointer-events:none}
  #ticker div{margin-top:4px;animation:tick 9s forwards}
  @keyframes tick{0%{opacity:0;transform:translateY(4px)}5%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
  #hint{position:fixed;bottom:16px;right:18px;font-size:9.5px;letter-spacing:0.14em;color:var(--dim);opacity:0.75}
  #mapLink{display:block;text-align:center;margin-top:10px;font-size:10px;letter-spacing:0.18em;
           color:var(--dim);text-decoration:none;transition:color .15s}
  #mapLink:hover{color:var(--cyan)}
  @media (prefers-reduced-motion: reduce){ #ticker div{animation:none} }
</style>
</head>
<body>
<canvas id="dish"></canvas>

<div class="panel" id="tools">
  <h1>PRIMORDIAL SOUP</h1>
  <div class="sub">a small evolving universe</div>
  <div class="row">
    <button id="btnPause" title="space">⏸</button>
    <div class="seg" id="speedSeg">
      <button data-sp="1" class="on">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
    </div>
  </div>
  <div class="ptitle" style="margin-top:14px">MEDDLE · CLICK THE DISH</div>
  <div class="toolgrid" id="toolSeg">
    <button data-tool="inspect" class="on">🔍 inspect</button>
    <button data-tool="meteor">☄️ meteor</button>
    <button data-tool="bloom">🌿 bloom</button>
    <button data-tool="seed">🧬 seed</button>
  </div>
  <div class="ptitle">CATASTROPHES</div>
  <div class="row">
    <button id="btnPlague" class="warn" style="flex:1">🦠 plague</button>
    <button id="btnIce" class="warn" style="flex:1">❄️ ice age</button>
  </div>
  <div class="ptitle">DIALS</div>
  <div class="dial">
    <label><span>☀️ food supply</span><b id="foodVal"></b></label>
    <input type="range" id="foodRate" min="2" max="26" step="0.5" value="14">
  </div>
  <div class="dial">
    <label><span>☢️ radiation</span><b id="radVal"></b></label>
    <input type="range" id="mutRate" min="0.005" max="0.25" step="0.005" value="0.10">
  </div>
  <button class="wide" id="btnReset">↻ new dish</button>
  <a id="mapLink" href="roadmap.html">🗺 roadmap</a>
</div>

<div class="panel" id="report">
  <div class="ptitle">DISH REPORT</div>
  <div class="bignums">
    <div><span id="stPop">0</span><label>CELLS</label></div>
    <div class="alg"><span id="stAlgae">0</span><label>ALGAE</label></div>
  </div>
  <div class="subnums">gen <b id="stGen">1</b> · species <b id="stSpecies">1</b> · strains <b id="stStrains">1</b></div>
  <div class="subnums">born <b id="stBirths">0</b> · sexual <b id="stSex">0</b> · cloned <b id="stClone">0</b> · died <b id="stDeaths">0</b></div>
  <canvas id="popChart"></canvas>
  <div class="ptitle">TRAIT DRIFT</div>
  <div class="spark"><span class="lbl">size</span><canvas id="spSize"></canvas><span class="val" id="vSize"></span></div>
  <div class="spark"><span class="lbl">speed</span><canvas id="spSpeed"></canvas><span class="val" id="vSpeed"></span></div>
  <div class="spark"><span class="lbl">vision</span><canvas id="spSense"></canvas><span class="val" id="vSense"></span></div>
  <div class="spark"><span class="lbl">diet</span><canvas id="spDiet"></canvas><span class="val" id="vDiet"></span></div>
</div>

<div class="panel" id="inspector">
  <button class="close" id="inspClose">✕</button>
  <div class="name" id="inspName"></div>
  <div class="meta" id="inspMeta"></div>
  <div class="ebar"><i id="inspEnergy"></i></div>
  <div id="inspGenes"></div>
</div>

<div id="ticker"></div>
<div id="hint">CLICK A CELL TO INSPECT</div>

<script>
'use strict';
// ---------- utilities ----------
const TAU = Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}
const lerp=(a,b,t)=>a+(b-a)*t;
const hueDist=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d;};

// ---------- canvas ----------
const cv=document.getElementById('dish'), ctx=cv.getContext('2d');
let W=0,H=0,CX=0,CY=0,R=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H/2; R=Math.min(W,H)/2-26;
}
let worldReady=false;
function rescue(){
  for(const c of creatures){
    const dx=c.x-CX,dy=c.y-CY;
    if(Math.sqrt(dx*dx+dy*dy)>R-c.g.size){const [x,y]=randInDish(0.85);c.x=x;c.y=y;}
  }
  for(const a of algae){
    const dx=a.x-CX,dy=a.y-CY;
    if(dx*dx+dy*dy>R*R){const [x,y]=randInDish();a.x=x;a.y=y;}
  }
}
window.addEventListener('resize',()=>{resize();if(worldReady){initCharts();genTerrain();initSnow();rescue();}});
window.addEventListener('error',e=>{try{say('⚠ '+e.message);}catch(_){}});
resize();

// ---------- genome ----------
const GENES={
  size:  {min:3,  max:14,  sd:0.5},
  speed: {min:8,  max:130, sd:0.5},
  sense: {min:15, max:210, sd:0.5},
  diet:  {min:0,  max:1,   sd:0.5},
  fear:  {min:0,  max:1,   sd:0.5},
  rThresh:{min:0.55,max:0.95,sd:0.35},
  wiggle:{min:0.5,max:4,   sd:0.5},
  herd:  {min:0,  max:1,   sd:0.5},
};
let mutRate=0.10;
function founderGenome(baseHue){
  return {
    size: clamp(5.5+gauss()*0.8, GENES.size.min, GENES.size.max),
    speed:clamp(55+gauss()*12,  GENES.speed.min,GENES.speed.max),
    sense:clamp(80+gauss()*20,  GENES.sense.min,GENES.sense.max),
    diet: clamp(Math.abs(gauss())*0.06+0.04, 0, 1),
    fear: clamp(0.5+gauss()*0.15, 0, 1),
    rThresh:clamp(0.78+gauss()*0.05, GENES.rThresh.min, GENES.rThresh.max),
    wiggle:clamp(2+gauss()*0.5, GENES.wiggle.min, GENES.wiggle.max),
    herd: clamp(0.1+Math.abs(gauss())*0.1, 0, 1),
    hue: (baseHue+gauss()*14+360)%360,
  };
}
function mutate(g){
  const c={...g};
  for(const k in GENES){
    const G=GENES[k];
    c[k]=clamp(c[k]+gauss()*mutRate*(G.max-G.min)*G.sd, G.min, G.max);
  }
  c.hue=(c.hue+gauss()*mutRate*80+360)%360;
  return c;
}

// ---------- world state ----------
let creatures=[], algae=[], newborns=[], rocks=[], jets=[];
let nextId=1, births=0, deaths=0, maxGen=1, simT=0;
let sexBirths=0, cloneBirths=0;
let paused=false, speedMult=1, tool='inspect', selected=null;
let iceUntil=-1, shake=0, extinctAt=-1, lastSpeciesN=1, lastSpeciesMsgT=0;
let foodRate=11;
const ALGAE_E=70, ALGAE_CAP=3000, POP_CAP=850;
const blooms=[];
const events=[]; // visual rings {x,y,t0,dur,r0,r1,color,width}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const SYL=['blo','gur','mip','zor','vel','tik','osh','ree','dal','umo','kai','pex','nur','ova','glim','fen','qua','bim'];
const nameOf=c=>{const a=SYL[c.id%18],b=SYL[(c.id*7+3)%18];return a[0].toUpperCase()+a.slice(1)+b;};

function makeCreature(g,x,y,energy,gen){
  const cap=12*g.size*g.size;
  return {id:nextId++, g, x, y, dir:rand(0,TAU), energy:energy??cap*0.65, cap,
          age:0, gen:gen||1, kids:0, lifespan:Math.max(70,130+gauss()*25),
          dead:false, phase:rand(0,TAU), lock:null, lockT:0, lastRep:-99, mateT:0};
}
function randInDish(f=1){
  const a=rand(0,TAU), r=Math.sqrt(Math.random())*R*f;
  return [CX+Math.cos(a)*r, CY+Math.sin(a)*r];
}
function spawnAlgae(x,y){
  if(algae.length>=ALGAE_CAP)return;
  for(const rk of rocks){const dx=x-rk.x,dy=y-rk.y;if(dx*dx+dy*dy<(rk.r+2)**2)return;}
  algae.push({x,y,eaten:false});
}
function genTerrain(){
  rocks.length=0; jets.length=0;
  const nR=5+((Math.random()*4)|0);
  for(let i=0;i<nR;i++){
    for(let t=0;t<24;t++){
      const r=rand(24,62), a=rand(0,TAU), d=Math.sqrt(Math.random())*(R-r-48);
      const x=CX+Math.cos(a)*d, y=CY+Math.sin(a)*d;
      let ok=true;
      for(const o of rocks){if(Math.hypot(o.x-x,o.y-y)<o.r+r+28){ok=false;break;}}
      if(ok){
        const spk=[];
        for(let s=0;s<r/4;s++){const sa=rand(0,TAU),sd=Math.sqrt(Math.random())*r*0.8;
          spk.push([Math.cos(sa)*sd,Math.sin(sa)*sd]);}
        rocks.push({x,y,r,spk});break;
      }
    }
  }
  const nJ=2+((Math.random()*2)|0);
  for(let i=0;i<nJ;i++)jets.push({ang:rand(0,TAU), off:rand(-R*0.5,R*0.5), width:rand(70,120),
    strength:rand(14,26)*(Math.random()<0.5?-1:1), drift:rand(-0.003,0.003)});
}
function rockPush(o,s){
  for(const rk of rocks){
    const dx=o.x-rk.x; if(dx>rk.r+s||dx<-rk.r-s)continue;
    const dy=o.y-rk.y; if(dy>rk.r+s||dy<-rk.r-s)continue;
    const d2=dx*dx+dy*dy, min=rk.r+s;
    if(d2<min*min){const d=Math.sqrt(d2)||0.001;o.x=rk.x+dx/d*min;o.y=rk.y+dy/d*min;}
  }
}
function ping(x,y,color,r1=26,width=1.5,dur=0.6){ events.push({x,y,t0:simT,dur,r0:2,r1,color,width}); }

function initWorld(){
  creatures.length=0; algae.length=0; events.length=0; blooms.length=0;
  births=0; deaths=0; maxGen=1; simT=0; iceUntil=-1; selected=null; extinctAt=-1;
  lastSample=-1; lastHud=-9; sexBirths=0; cloneBirths=0; lastSpeciesN=1; lastSpeciesMsgT=0;
  hist.t=[];hist.pop=[];hist.alg=[];hist.size=[];hist.speed=[];hist.sense=[];hist.diet=[];
  const baseHue=rand(140,280);
  genTerrain(); initSnow();
  for(let i=0;i<5;i++){const [x,y]=randInDish(0.7); blooms.push({x,y});}
  for(let i=0;i<70;i++){const [x,y]=randInDish(0.9); creatures.push(makeCreature(founderGenome(baseHue),x,y));}
  for(let i=0;i<1600;i++){
    if(Math.random()<0.55){const [x,y]=randInDish(); spawnAlgae(x,y);}
    else{const b=blooms[(Math.random()*blooms.length)|0];
      const x=b.x+gauss()*90,y=b.y+gauss()*90;
      if((x-CX)**2+(y-CY)**2<R*R) spawnAlgae(x,y);}
  }
  say('the dish forms: '+rocks.length+' rocks, '+jets.length+' currents, 70 founder cells');
  updateInspector();
}

// ---------- spatial hash ----------
const CELL=105;
function buildGrid(list){
  const g=new Map();
  for(const o of list){
    const k=(Math.floor(o.x/CELL)*100000)+Math.floor(o.y/CELL);
    let a=g.get(k); if(!a){a=[];g.set(k,a);} a.push(o);
  }
  return g;
}
function queryGrid(grid,x,y,r,out){
  out.length=0;
  const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL);
  const y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){
    const a=grid.get(cx*100000+cy); if(a)for(const o of a)out.push(o);
  }
  return out;
}

// ---------- flow field: gentle gyre + wandering jet currents ----------
function flow(x,y,t,out){
  const dx=x-CX,dy=y-CY,r=Math.sqrt(dx*dx+dy*dy)||1;
  const tang=3*(r/R);
  let vx=Math.sin(y*0.005+t*0.08)*3 + (-dy/r)*tang;
  let vy=Math.cos(x*0.005+t*0.06)*3 + ( dx/r)*tang;
  for(const j of jets){
    const a=j.ang+t*j.drift, ca=Math.cos(a), sa=Math.sin(a);
    const d=(-sa*dx+ca*dy)-j.off;
    const w=Math.exp(-(d*d)/(2*j.width*j.width));
    vx+=ca*j.strength*w; vy+=sa*j.strength*w;
  }
  out[0]=vx; out[1]=vy;
}

// ---------- simulation ----------
const _n1=[],_n2=[],_fl=[0,0];
function step(dt){
  simT+=dt;
  const ice=simT<iceUntil;
  // food spawn
  const rate=foodRate*(ice?0.15:1)*(1+0.6*clamp(1-algae.length/400,0,1));
  let n=rate*dt; if(Math.random()<n%1)n++;
  for(let i=0;i<(n|0);i++){
    if(Math.random()<0.55){const [x,y]=randInDish(); spawnAlgae(x,y);}
    else{const b=blooms[(Math.random()*blooms.length)|0];
      const x=b.x+gauss()*90,y=b.y+gauss()*90;
      if((x-CX)**2+(y-CY)**2<(R-6)**2) spawnAlgae(x,y);}
  }
  // blooms wander
  for(const b of blooms){
    b.x+=gauss()*8*dt*6; b.y+=gauss()*8*dt*6;
    const dx=b.x-CX,dy=b.y-CY,d=Math.sqrt(dx*dx+dy*dy);
    if(d>R*0.75){b.x=CX+dx/d*R*0.75;b.y=CY+dy/d*R*0.75;}
    rockPush(b,20);
  }
  // algae drift with the currents, deflecting around rocks
  for(const a of algae){ flow(a.x,a.y,simT,_fl); a.x+=_fl[0]*dt; a.y+=_fl[1]*dt; rockPush(a,2); }
  // marine snow traces the currents
  for(const p of snow){
    flow(p.x,p.y,simT,_fl); p.vx=_fl[0]; p.vy=_fl[1];
    p.x+=_fl[0]*dt; p.y+=_fl[1]*dt;
    if(p.x<0)p.x+=W; if(p.x>W)p.x-=W; if(p.y<0)p.y+=H; if(p.y>H)p.y-=H;
  }

  const cGrid=buildGrid(creatures), aGrid=buildGrid(algae);
  newborns.length=0;

  for(const c of creatures){
    if(c.dead)continue;
    const g=c.g;
    c.age+=dt;
    // perceive
    const sense=g.sense;
    let algT=null,algD2=1e12, prey=null,preyD2=1e12, threat=null,thrD2=1e12;
    const hungry=c.energy<Math.min(0.97,g.rThresh+0.06)*c.cap;
    if(!hungry)c.lock=null;
    if(g.diet<0.92){
      queryGrid(aGrid,c.x,c.y,sense,_n1);
      for(const a of _n1){ if(a.eaten)continue;
        const d2=(a.x-c.x)**2+(a.y-c.y)**2;
        if(d2<algD2&&d2<sense*sense){algD2=d2;algT=a;}}
    }
    let bite=null,biteD2=1e12;
    if(c.lock){
      c.lockT+=dt;
      if(c.lock.dead||c.lockT>7) c.lock=null;
      else{
        const d2=(c.lock.x-c.x)**2+(c.lock.y-c.y)**2;
        if(d2<sense*sense*1.69){prey=c.lock;preyD2=d2;}
        else c.lock=null;
      }
    }
    const ready=c.energy>g.rThresh*c.cap && c.age>6 && c.age-c.lastRep>9;
    let mate=null,mateD2=1e12,mateScore=-1;
    let kinN=0,kinX=0,kinY=0,kinCos=0,kinSin=0;
    const herdR2=sense*sense*0.72;
    queryGrid(cGrid,c.x,c.y,sense,_n2);
    const fleeRange=sense*(0.4+0.6*g.fear);
    for(const o of _n2){ if(o===c||o.dead)continue;
      const d2=(o.x-c.x)**2+(o.y-c.y)**2;
      const hd=hueDist(o.g.hue,g.hue);
      const kin=hd<55;
      if(hungry && g.diet>0.35 && o.g.size<g.size*0.83){
        if(!prey && d2<sense*sense && d2<preyD2){preyD2=d2;prey=o;}
        const br=g.size+o.g.size*0.3+3;
        if(d2<br*br && d2<biteD2){biteD2=d2;bite=o;}
      }
      if(ready && hd<40 && d2<sense*sense &&
         o.energy>o.g.rThresh*o.cap && o.age>6 && o.age-o.lastRep>9){
        const sc=(40-hd)/Math.max(Math.sqrt(d2),20);
        if(sc>mateScore){mateScore=sc;mateD2=d2;mate=o;}
      }
      if(kin && g.herd>0.15 && d2<herdR2){kinN++;kinX+=o.x;kinY+=o.y;kinCos+=Math.cos(o.dir);kinSin+=Math.sin(o.dir);}
      if(o.g.size>g.size*1.15 && o.g.diet>0.4 && d2<fleeRange*fleeRange && d2<thrD2){thrD2=d2;threat=o;}
    }
    // choose heading
    let want=null, urgency=1, arrive=1, hunting=false;
    if(threat){
      const a=Math.atan2(c.y-threat.y,c.x-threat.x); want=a; urgency=1.15;
      if(g.herd>0.3&&kinN>=2){
        const ha=Math.atan2(kinSin,kinCos);
        let dd=ha-want;while(dd>Math.PI)dd-=TAU;while(dd<-Math.PI)dd+=TAU;
        want+=dd*g.herd*0.3;
      }
    }else if(ready&&mate){
      want=Math.atan2(mate.y-c.y,mate.x-c.x);
      arrive=clamp(Math.sqrt(mateD2)/30,0.4,1);
      c.lock=null;
    }else{
      const sA=algT ?(1-g.diet)      /Math.max(Math.sqrt(algD2),20):0;
      const sP=prey?(0.1+0.9*Math.pow(g.diet,1.6))*3/Math.max(Math.sqrt(preyD2),20):0;
      if(prey&&(c.lock===prey||sP>sA)){
        // lead pursuit: aim at the intercept point, not where the prey is now
        const tau=Math.min(1.0,Math.sqrt(preyD2)/Math.max(30,g.speed));
        const ix=prey.x+Math.cos(prey.dir)*prey.g.speed*1.1*tau;
        const iy=prey.y+Math.sin(prey.dir)*prey.g.speed*1.1*tau;
        want=Math.atan2(iy-c.y,ix-c.x);
        if(c.lock!==prey)c.lockT=0;
        c.lock=prey; hunting=preyD2<(g.size*5)**2;
        if(hunting)urgency=1.2;
      }else{
        c.lock=null;
        if(algT){
          want=Math.atan2(algT.y-c.y,algT.x-c.x);
          arrive=clamp(Math.sqrt(algD2)/30,0.35,1);
        }
      }
    }
    // wanderers steer off rocks; everyone else slides along them
    if(want==null){
      for(const rk of rocks){
        const rdx=c.x-rk.x,rdy=c.y-rk.y;
        if(Math.abs(rdx)<rk.r+g.size+24&&Math.abs(rdy)<rk.r+g.size+24&&
           rdx*rdx+rdy*rdy<(rk.r+g.size+24)**2){want=Math.atan2(rdy,rdx);break;}
      }
    }
    // herd: drift toward the kin school (cohesion+alignment), never mid-hunt or mid-flee
    if(g.herd>0.15 && kinN>=2 && !hunting && !threat){
      const hAng=Math.atan2((kinY/kinN-c.y)+(kinSin/kinN)*26,(kinX/kinN-c.x)+(kinCos/kinN)*26);
      if(want==null)want=hAng;
      else{let hd=hAng-want;while(hd>Math.PI)hd-=TAU;while(hd<-Math.PI)hd+=TAU;want+=hd*g.herd*0.35;}
    }
    // dish edge: blend inward instead of overriding, so the rim is no sanctuary
    const ex=c.x-CX,ey=c.y-CY,er=Math.sqrt(ex*ex+ey*ey);
    const margin=R-g.size-14;
    if(er>margin){
      const inward=Math.atan2(CY-c.y,CX-c.x);
      if(want==null)want=inward;
      else if(!hunting&&!threat){
        let dd=inward-want; while(dd>Math.PI)dd-=TAU; while(dd<-Math.PI)dd+=TAU;
        want+=dd*clamp((er-margin)/14,0,1)*0.85;
      }
    }
    // steer
    if(want!=null){
      let d=want-c.dir; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
      const tr=hunting?10:6;
      c.dir+=clamp(d,-tr*dt,tr*dt);
    }else{
      c.dir+=gauss()*g.wiggle*dt;
    }
    // move
    const sp=g.speed*(simT<iceUntil?0.65:1)*urgency*arrive*(want==null?0.75:1);
    flow(c.x,c.y,simT,_fl);
    const cf=clamp(0.85-g.size*0.05,0.15,0.8);
    c.x+=Math.cos(c.dir)*sp*dt+_fl[0]*cf*dt;
    c.y+=Math.sin(c.dir)*sp*dt+_fl[1]*cf*dt;
    rockPush(c,g.size);
    const nx=c.x-CX,ny=c.y-CY,nr=Math.sqrt(nx*nx+ny*ny);
    if(nr>R-g.size){c.x=CX+nx/nr*(R-g.size);c.y=CY+ny/nr*(R-g.size);}
    // metabolism
    const s2=g.size*g.size, vn=sp/60;
    let burn=(0.12*s2*(1-0.25*g.diet) + 0.10*s2*vn*vn*(1-0.15*g.diet) + 8e-5*sense*sense)*(simT<iceUntil?0.8:1);
    c.energy-=burn*dt;
    // eat algae (graze everything within reach)
    if(g.diet<0.92&&c.energy<c.cap){
      const rr=(g.size+4)**2;
      for(const a of _n1){
        if(a.eaten)continue;
        if((a.x-c.x)**2+(a.y-c.y)**2<rr){
          a.eaten=true;
          c.energy+=ALGAE_E*(1-g.diet);
          if(c.energy>=c.cap){c.energy=c.cap;break;}
        }
      }
    }
    // eat prey (bite whatever the jaws touch, else the locked chase target)
    const meal=bite||prey;
    if(meal&&!meal.dead&&g.size>1.2*meal.g.size){
      const d2=(meal.x-c.x)**2+(meal.y-c.y)**2;
      const rr=(g.size+meal.g.size*0.3+3);
      if(d2<rr*rr){
        meal.dead=true; meal.killed=true; deaths++; c.lock=null; c.lockT=0;
        const flesh=(meal.energy*0.8+meal.cap*0.7)*(0.1+0.9*Math.pow(g.diet,1.6));
        c.energy=Math.min(c.cap,c.energy+flesh);
        ping(meal.x,meal.y,'rgba(255,107,94,0.7)',meal.g.size*4,2,0.5);
        if(selected===meal)selected=null;
      }
    }
    // reproduce: sexual on contact with a ready kin mate; lonely fallback = self-clone
    const room=creatures.length+newborns.length<POP_CAP;
    if(ready&&room&&mate&&!mate.dead){
      const mr=(g.size+mate.g.size)*0.9;
      if(mateD2<mr*mr){
        const cg={};
        for(const k in GENES)cg[k]=Math.random()<0.5?g[k]:mate.g[k];
        cg.hue=Math.random()<0.5?g.hue:mate.g.hue;
        const mg=mutate(cg);
        const child=makeCreature(mg,(c.x+mate.x)/2,(c.y+mate.y)/2,null,Math.max(c.gen,mate.gen)+1);
        child.energy=Math.min((c.energy+mate.energy)*0.28,child.cap);
        c.energy*=0.68; mate.energy*=0.68;
        c.kids++; mate.kids++; c.lastRep=c.age; mate.lastRep=mate.age;
        c.mateT=0; mate.mateT=0;
        newborns.push(child); births++; sexBirths++;
        if(child.gen>maxGen)maxGen=child.gen;
        ping((c.x+mate.x)/2,(c.y+mate.y)/2,'rgba(255,255,255,0.55)',g.size*3,1,0.6);
      }else c.mateT+=dt;
    }else if(ready&&room){
      c.mateT+=dt;
      if(c.mateT>5){
        const cg=mutate(g);
        const child=makeCreature(cg, c.x+gauss()*10, c.y+gauss()*10, null, c.gen+1);
        child.energy=Math.min(c.energy*0.45,child.cap);
        c.energy*=0.45; c.kids++; c.lastRep=c.age; c.mateT=0;
        newborns.push(child); births++; cloneBirths++;
        if(child.gen>maxGen)maxGen=child.gen;
        ping(c.x,c.y,'hsla('+cg.hue+',80%,70%,0.5)',g.size*3,1,0.6);
      }
    }else c.mateT=0;
    // death
    if(c.energy<=0||c.age>c.lifespan){
      c.dead=true; deaths++;
      const bits=Math.min(6,Math.floor(g.size*0.8));
      for(let i=0;i<bits;i++)spawnAlgae(c.x+gauss()*8,c.y+gauss()*8);
      if(selected===c)selected=null;
    }
  }
  if(newborns.length)creatures.push(...newborns);
  let w=0;
  for(const c of creatures)if(!c.dead)creatures[w++]=c;
  creatures.length=w;
  w=0;
  for(const a of algae)if(!a.eaten)algae[w++]=a;
  algae.length=w;

  // extinction watch → spontaneous generation
  if(creatures.length===0){
    if(extinctAt<0){extinctAt=simT; say('extinction. the dish falls silent');}
    else if(simT-extinctAt>5){
      extinctAt=-1;
      const baseHue=rand(0,360);
      for(let i=0;i<28;i++){const [x,y]=randInDish(0.8);creatures.push(makeCreature(founderGenome(baseHue),x,y));}
      say('spontaneous generation: life tries again');
    }
  }else extinctAt=-1;
}

// ---------- stats history ----------
const hist={t:[],pop:[],alg:[],size:[],speed:[],sense:[],diet:[]};
let lastSample=-1;
function sample(){
  if(simT-lastSample<0.5)return;
  lastSample=simT;
  let n=creatures.length,ms=0,mv=0,mn=0,md=0;
  for(const c of creatures){ms+=c.g.size;mv+=c.g.speed;mn+=c.g.sense;md+=c.g.diet;}
  hist.t.push(simT);
  hist.pop.push(n); hist.alg.push(algae.length);
  hist.size.push(n?ms/n:NaN); hist.speed.push(n?mv/n:NaN);
  hist.sense.push(n?mn/n:NaN); hist.diet.push(n?md/n:NaN);
  const MAX=260;
  for(const k in hist)if(hist[k].length>MAX)hist[k].shift();
}
function speciesCount(){
  const n=creatures.length;
  if(n<3)return n?1:0;
  const hues=[];for(const c of creatures)hues.push(c.g.hue);
  hues.sort((a,b)=>a-b);
  const parts=[];let cur=1;
  for(let i=1;i<n;i++){
    if(hues[i]-hues[i-1]<40)cur++;
    else{parts.push(cur);cur=1;}
  }
  parts.push(cur);
  if(parts.length>1&&(360-hues[n-1]+hues[0])<40)parts[0]+=parts.pop();
  return parts.filter(s=>s>=3).length||1;
}
function strains(){
  const buckets=new Uint16Array(24);
  for(const c of creatures)buckets[Math.floor(c.g.hue/15)%24]++;
  const min=Math.max(2,creatures.length*0.02);
  let s=0;for(const b of buckets)if(b>=min)s++;
  return Math.max(s,creatures.length?1:0);
}

// ---------- rendering ----------
const glowCache={};
function glowSprite(hue){
  const b=Math.round(hue/15)*15;
  if(glowCache[b])return glowCache[b];
  const s=document.createElement('canvas');s.width=s.height=64;
  const g=s.getContext('2d');
  const gr=g.createRadialGradient(32,32,2,32,32,32);
  gr.addColorStop(0,'hsla('+b+',90%,65%,0.55)');
  gr.addColorStop(1,'hsla('+b+',90%,65%,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);
  glowCache[b]=s;return s;
}
const snow=[];
function initSnow(){snow.length=0;for(let i=0;i<140;i++)snow.push({x:rand(0,W),y:rand(0,H),vx:0,vy:0});}

function render(){
  // trail fade
  ctx.fillStyle='rgba(5,10,20,0.30)';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0&&!reduceMotion){ctx.translate(gauss()*shake,gauss()*shake);shake=Math.max(0,shake-0.5);}
  // marine snow streaks trace the currents
  ctx.strokeStyle='rgba(160,200,240,0.10)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(const p of snow){ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.5,p.y-p.vy*0.5);}
  ctx.stroke();
  // algae
  ctx.fillStyle='rgba(111,224,138,0.85)';
  for(const a of algae)ctx.fillRect(a.x-1.1,a.y-1.1,2.2,2.2);
  // rocks
  for(const rk of rocks){
    ctx.fillStyle='#0B1322';
    ctx.beginPath();ctx.arc(rk.x,rk.y,rk.r,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(99,140,190,0.16)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle='rgba(160,200,240,0.07)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(rk.x,rk.y,rk.r-4,Math.PI*1.05,Math.PI*1.7);ctx.stroke();
    ctx.fillStyle='rgba(120,160,210,0.10)';
    for(const s of rk.spk)ctx.fillRect(rk.x+s[0],rk.y+s[1],1.6,1.6);
  }
  // creatures
  for(const c of creatures){
    const g=c.g,s=g.size,h=g.hue;
    const vit=clamp(c.energy/c.cap,0,1);
    ctx.globalAlpha=0.25+0.35*vit;
    ctx.globalCompositeOperation='lighter';
    const gl=glowSprite(h),gs=s*6;
    ctx.drawImage(gl,c.x-gs/2,c.y-gs/2,gs,gs);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=0.55+0.45*vit;
    // flagella
    const wag=Math.sin(simT*9+c.phase)*0.9;
    const bx=c.x-Math.cos(c.dir)*s, by=c.y-Math.sin(c.dir)*s;
    const tx=c.x-Math.cos(c.dir+wag*0.5)*s*3.1, ty=c.y-Math.sin(c.dir+wag*0.5)*s*3.1;
    const mx=c.x-Math.cos(c.dir+wag)*s*1.9, my=c.y-Math.sin(c.dir+wag)*s*1.9;
    ctx.strokeStyle='hsla('+h+',70%,68%,0.55)';
    ctx.lineWidth=Math.max(1,s*0.16);
    ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(mx,my,tx,ty);ctx.stroke();
    // spikes (carnivores)
    if(g.diet>0.45){
      ctx.strokeStyle='hsla('+h+',85%,78%,0.8)';
      ctx.lineWidth=1.2;
      ctx.beginPath();
      const len=s*(0.35+0.55*(g.diet-0.45)/0.55);
      for(let i=0;i<7;i++){
        const a=c.dir+i/7*TAU;
        ctx.moveTo(c.x+Math.cos(a)*s*0.9,c.y+Math.sin(a)*s*0.9);
        ctx.lineTo(c.x+Math.cos(a)*(s*0.9+len),c.y+Math.sin(a)*(s*0.9+len));
      }
      ctx.stroke();
    }
    // body
    ctx.fillStyle='hsla('+h+',72%,60%,0.92)';
    ctx.beginPath();ctx.arc(c.x,c.y,s,0,TAU);ctx.fill();
    ctx.strokeStyle='hsla('+h+',80%,78%,0.7)';
    ctx.lineWidth=1;ctx.stroke();
    // nucleus + eye
    ctx.fillStyle='hsla('+h+',60%,88%,0.9)';
    ctx.beginPath();ctx.arc(c.x-Math.cos(c.dir)*s*0.2,c.y-Math.sin(c.dir)*s*0.2,s*0.32,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(8,14,26,0.9)';
    ctx.beginPath();ctx.arc(c.x+Math.cos(c.dir)*s*0.5,c.y+Math.sin(c.dir)*s*0.5,Math.max(1,s*0.16),0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  // event rings
  for(let i=events.length-1;i>=0;i--){
    const e=events[i],t=(simT-e.t0)/e.dur;
    if(t>=1){events.splice(i,1);continue;}
    ctx.strokeStyle=e.color;ctx.globalAlpha=1-t;ctx.lineWidth=e.width;
    ctx.beginPath();ctx.arc(e.x,e.y,lerp(e.r0,e.r1,t),0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;
  // selection ring
  if(selected&&!selected.dead){
    ctx.strokeStyle='rgba(99,226,255,0.9)';ctx.lineWidth=1.2;
    ctx.setLineDash([4,4]);ctx.lineDashOffset=-simT*20;
    ctx.beginPath();ctx.arc(selected.x,selected.y,selected.g.size+7,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
  // outside-dish mask
  ctx.fillStyle='#04070F';
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(CX,CY,R,0,TAU,true);ctx.fill();
  // rim
  ctx.strokeStyle=simT<iceUntil?'rgba(150,200,255,0.5)':'rgba(99,226,255,0.20)';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(CX,CY,R,0,TAU);ctx.stroke();
  ctx.strokeStyle='rgba(99,226,255,0.06)';
  ctx.beginPath();ctx.arc(CX,CY,R+7,0,TAU);ctx.stroke();
  // ice tint
  if(simT<iceUntil){
    ctx.fillStyle='rgba(140,190,255,0.05)';
    ctx.beginPath();ctx.arc(CX,CY,R,0,TAU);ctx.fill();
  }
}

// ---------- charts ----------
function setupChart(id){const c=document.getElementById(id);
  const r=c.getBoundingClientRect();
  c.width=r.width*DPR;c.height=r.height*DPR;
  const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  return {g,w:r.width,h:r.height};}
let popC,spC={};
function initCharts(){
  popC=setupChart('popChart');
  spC={size:setupChart('spSize'),speed:setupChart('spSpeed'),sense:setupChart('spSense'),diet:setupChart('spDiet')};
}
function drawLine(g,w,h,data,color,vmax,vmin=0){
  const n=data.length;if(n<2)return;
  g.strokeStyle=color;g.lineWidth=1.2;g.beginPath();
  let started=false;
  for(let i=0;i<n;i++){
    const v=data[i];if(isNaN(v)){started=false;continue;}
    const x=i/(n-1)*w, y=h-2-(clamp(v,vmin,vmax)-vmin)/(vmax-vmin)*(h-5);
    if(!started){g.moveTo(x,y);started=true;}else g.lineTo(x,y);
  }
  g.stroke();
}
function drawCharts(){
  let {g,w,h}=popC;
  g.clearRect(0,0,w,h);
  g.strokeStyle='rgba(99,140,190,0.12)';g.lineWidth=1;
  for(let i=1;i<3;i++){g.beginPath();g.moveTo(0,h*i/3);g.lineTo(w,h*i/3);g.stroke();}
  const pmax=Math.max(120,...hist.pop)*1.15, amax=Math.max(800,...hist.alg)*1.15;
  drawLine(g,w,h,hist.alg,'rgba(111,224,138,0.55)',amax);
  drawLine(g,w,h,hist.pop,'rgba(201,216,234,0.95)',pmax);
  const traits={size:[GENES.size.min,GENES.size.max,'#C9D8EA'],
                speed:[GENES.speed.min,GENES.speed.max,'#63E2FF'],
                sense:[GENES.sense.min,GENES.sense.max,'#B48CFF'],
                diet:[0,1,'#FF6B5E']};
  for(const k in traits){
    const [mn,mx,col]=traits[k],c=spC[k];
    c.g.clearRect(0,0,c.w,c.h);
    c.g.strokeStyle='rgba(99,140,190,0.12)';c.g.beginPath();
    c.g.moveTo(0,c.h/2);c.g.lineTo(c.w,c.h/2);c.g.stroke();
    drawLine(c.g,c.w,c.h,hist[k],col,mx,mn);
  }
}

// ---------- HUD ----------
const $=id=>document.getElementById(id);
function say(msg){
  const d=document.createElement('div');d.textContent=msg;
  const t=$('ticker');t.appendChild(d);
  while(t.children.length>4)t.removeChild(t.firstChild);
}
let lastHud=0;
function updateHud(){
  if(simT-lastHud<0.25)return;lastHud=simT;
  $('stPop').textContent=creatures.length;
  $('stAlgae').textContent=algae.length;
  $('stGen').textContent=maxGen;
  $('stStrains').textContent=strains();
  $('stBirths').textContent=births;
  $('stDeaths').textContent=deaths;
  $('stSex').textContent=sexBirths;
  $('stClone').textContent=cloneBirths;
  const spN=speciesCount();
  $('stSpecies').textContent=spN;
  if(simT>20&&simT-lastSpeciesMsgT>10){
    if(spN>lastSpeciesN){say('🌱 divergence: '+spN+' species now share the dish');lastSpeciesMsgT=simT;}
    else if(spN<lastSpeciesN){say('a species has vanished from the dish');lastSpeciesMsgT=simT;}
  }
  lastSpeciesN=spN;
  const L=hist.pop.length-1;
  if(L>=0){
    $('vSize').textContent=isNaN(hist.size[L])?'·':hist.size[L].toFixed(1);
    $('vSpeed').textContent=isNaN(hist.speed[L])?'·':hist.speed[L].toFixed(0);
    $('vSense').textContent=isNaN(hist.sense[L])?'·':hist.sense[L].toFixed(0);
    const d=hist.diet[L];
    $('vDiet').textContent=isNaN(d)?'·':(d<0.25?'herb':d<0.55?'omni':'carn')+' '+d.toFixed(2);
  }
  drawCharts();
  updateInspector();
}
function updateInspector(){
  const el=$('inspector');
  if(!selected||selected.dead){el.classList.remove('show');return;}
  el.classList.add('show');
  const c=selected,g=c.g;
  $('inspName').textContent=nameOf(c);
  $('inspMeta').textContent='gen '+c.gen+' · age '+c.age.toFixed(0)+'s / '+c.lifespan.toFixed(0)+'s · '+c.kids+' offspring';
  $('inspEnergy').style.width=(clamp(c.energy/c.cap,0,1)*100).toFixed(0)+'%';
  const rows=[['size',(g.size-3)/11,g.size.toFixed(1)],
              ['speed',(g.speed-8)/122,g.speed.toFixed(0)],
              ['vision',(g.sense-15)/195,g.sense.toFixed(0)],
              ['diet',g.diet,(g.diet<0.25?'herbivore':g.diet<0.55?'omnivore':'carnivore')],
              ['herding',g.herd,g.herd<0.25?'loner':g.herd<0.6?'social':'flocker'],
              ['nerve',1-g.fear,g.fear<0.35?'bold':g.fear<0.65?'wary':'timid'],
              ['fertility',1-(g.rThresh-0.55)/0.4,'']];
  $('inspGenes').innerHTML=rows.map(([l,v,txt])=>
    '<div class="gene '+(l==='diet'?'diet':'')+'"><span class="lbl">'+l+'</span><div class="bar"><i style="width:'+(clamp(v,0,1)*100).toFixed(0)+'%"></i></div><span class="lbl" style="text-align:right">'+txt+'</span></div>').join('');
}

// ---------- god tools ----------
function meteor(x,y){
  let killed=0;
  for(const c of creatures)if(!c.dead&&(c.x-x)**2+(c.y-y)**2<115*115){c.dead=true;killed++;deaths++;if(selected===c)selected=null;}
  let w=0;for(const c of creatures)if(!c.dead)creatures[w++]=c;creatures.length=w;
  for(let i=0;i<70;i++){
    const a=rand(0,TAU),r=rand(60,150);
    const ax=x+Math.cos(a)*r,ay=y+Math.sin(a)*r;
    if((ax-CX)**2+(ay-CY)**2<R*R)spawnAlgae(ax,ay);
  }
  ping(x,y,'rgba(255,180,120,0.9)',150,3,0.8);
  ping(x,y,'rgba(255,107,94,0.6)',115,1.5,1.1);
  shake=7;
  say('☄️ meteor strike: '+killed+' cells vaporised, nutrients scattered');
}
function plague(){
  let killed=0;
  const grid=buildGrid(creatures),near=[];
  for(const c of creatures){
    queryGrid(grid,c.x,c.y,60,near);
    const density=clamp((near.length-1)/8,0,1);
    if(Math.random()<0.4+0.35*density){c.dead=true;killed++;deaths++;
      spawnAlgae(c.x+gauss()*6,c.y+gauss()*6);spawnAlgae(c.x+gauss()*6,c.y+gauss()*6);
      ping(c.x,c.y,'rgba(180,140,255,0.4)',c.g.size*3,1,0.7);
      if(selected===c)selected=null;}
  }
  let w=0;for(const c of creatures)if(!c.dead)creatures[w++]=c;creatures.length=w;
  say('🦠 plague sweeps the dish: '+killed+' perished (crowds suffered most)');
}
function iceAge(){
  iceUntil=simT+22;
  say('❄️ ice age: cold waters for 22s: scarce food, sluggish cells');
}
function seedCreature(x,y){
  const g={
    size:rand(3.5,13), speed:rand(15,125), sense:rand(30,200),
    diet:Math.random()<0.5?rand(0,0.3):rand(0.3,1),
    fear:rand(0,1), rThresh:rand(0.6,0.92), wiggle:rand(0.8,3.5),
    herd:rand(0,1), hue:rand(0,360),
  };
  creatures.push(makeCreature(g,x,y));
  ping(x,y,'hsla('+g.hue+',85%,70%,0.8)',30,1.5,0.8);
  say(g.diet>0.55?'🧬 a stranger with teeth slips into the dish':'🧬 a stranger arrives in the dish');
}
function bloomAt(x,y){
  for(let i=0;i<90;i++){
    const ax=x+gauss()*55,ay=y+gauss()*55;
    if((ax-CX)**2+(ay-CY)**2<R*R)spawnAlgae(ax,ay);
  }
  ping(x,y,'rgba(111,224,138,0.6)',70,1.5,0.8);
  say('🌿 algae bloom seeded');
}

// ---------- input ----------
cv.addEventListener('click',e=>{
  const x=e.clientX,y=e.clientY;
  if((x-CX)**2+(y-CY)**2>R*R)return;
  if(tool==='meteor')return meteor(x,y);
  if(tool==='bloom')return bloomAt(x,y);
  if(tool==='seed')return seedCreature(x,y);
  let best=null,bd=26*26;
  for(const c of creatures){
    const d=(c.x-x)**2+(c.y-y)**2;
    if(d<bd){bd=d;best=c;}
  }
  selected=best;updateInspector();
});
document.querySelectorAll('#toolSeg button').forEach(b=>b.addEventListener('click',()=>{
  tool=b.dataset.tool;
  document.querySelectorAll('#toolSeg button').forEach(o=>o.classList.toggle('on',o===b));
  cv.style.cursor=tool==='inspect'?'default':'crosshair';
}));
document.querySelectorAll('#speedSeg button').forEach(b=>b.addEventListener('click',()=>{
  speedMult=+b.dataset.sp;paused=false;$('btnPause').textContent='⏸';
  document.querySelectorAll('#speedSeg button').forEach(o=>o.classList.toggle('on',o===b));
}));
$('btnPause').addEventListener('click',()=>{paused=!paused;$('btnPause').textContent=paused?'▶':'⏸';});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('btnPause').click();}});
$('btnPlague').addEventListener('click',plague);
$('btnIce').addEventListener('click',iceAge);
let resetArm=0;
$('btnReset').addEventListener('click',()=>{
  const n=performance.now();
  if(n-resetArm<3000){store.del(SAVE_KEY);catchupLeft=0;initWorld();resetArm=0;$('btnReset').textContent='↻ new dish';}
  else{resetArm=n;$('btnReset').textContent='⚠ erase this world?';
    setTimeout(()=>{if(performance.now()-resetArm>=2900){$('btnReset').textContent='↻ new dish';resetArm=0;}},3100);}
});
$('inspClose').addEventListener('click',()=>{selected=null;updateInspector();});
const foodEl=$('foodRate'),radEl=$('mutRate');
function syncDials(){
  foodRate=+foodEl.value;mutRate=+radEl.value;
  $('foodVal').textContent=foodRate.toFixed(1)+'/s';
  $('radVal').textContent='×'+(mutRate/0.10).toFixed(1);
}
foodEl.addEventListener('input',syncDials);
radEl.addEventListener('input',syncDials);

// ---------- persistence: the dish lives between visits ----------
const GAME_V=5;
const SAVE_KEY='primordialSoup.save';
const store=(()=>{ try{ const t='__ps_t';localStorage.setItem(t,'1');localStorage.removeItem(t);
  return {get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v),del:k=>localStorage.removeItem(k)};
 }catch(e){ const m={}; return {get:k=>(k in m?m[k]:null),set:(k,v)=>{m[k]=String(v);},del:k=>{delete m[k];}}; }})();
let catchupLeft=0,cuB0=0,cuD0=0,cuG0=1,lastSaveT=0,hintCU=false;

function saveWorld(){
  try{
    const cs=creatures.map(c=>({id:c.id,x:Math.round(c.x*10)/10,y:Math.round(c.y*10)/10,
      dir:Math.round(c.dir*100)/100,energy:Math.round(c.energy),cap:c.cap,age:Math.round(c.age*10)/10,
      gen:c.gen,kids:c.kids,lifespan:Math.round(c.lifespan),lastRep:Math.round(c.lastRep*10)/10,
      phase:Math.round(c.phase*100)/100,g:c.g}));
    const al=new Array(algae.length*2);
    for(let i=0;i<algae.length;i++){al[i*2]=Math.round(algae[i].x);al[i*2+1]=Math.round(algae[i].y);}
    store.set(SAVE_KEY,JSON.stringify({v:GAME_V,savedAt:Date.now(),dish:{CX,CY,R},
      simT,nextId,births,deaths,sexBirths,cloneBirths,maxGen,iceUntil,lastSpeciesN,
      foodRate,mutRate,rocks,jets,blooms,cs,al,hist}));
  }catch(e){}
}
function loadWorld(){
  let s=null;
  try{s=JSON.parse(store.get(SAVE_KEY));}catch(e){return false;}
  if(!s||s.v!==GAME_V||!s.cs||!s.cs.length||!s.dish||!s.dish.R)return false;
  const sc=R/s.dish.R, ox=s.dish.CX, oy=s.dish.CY;
  const tx=x=>CX+(x-ox)*sc, ty=y=>CY+(y-oy)*sc;
  creatures.length=0;algae.length=0;events.length=0;blooms.length=0;rocks.length=0;jets.length=0;
  for(const c of s.cs){
    for(const k in GENES)if(typeof c.g[k]!=='number')c.g[k]=(GENES[k].min+GENES[k].max)/2;
    creatures.push({...c,x:tx(c.x),y:ty(c.y),dead:false,lock:null,lockT:0,mateT:0});
  }
  for(let i=0;i<s.al.length;i+=2)algae.push({x:tx(s.al[i]),y:ty(s.al[i+1]),eaten:false});
  for(const rk of s.rocks)rocks.push({x:tx(rk.x),y:ty(rk.y),r:rk.r*sc,spk:rk.spk||[]});
  for(const j of s.jets)jets.push({...j,off:j.off*sc,width:j.width*sc});
  for(const b of s.blooms)blooms.push({x:tx(b.x),y:ty(b.y)});
  simT=s.simT;nextId=s.nextId;births=s.births;deaths=s.deaths;
  sexBirths=s.sexBirths||0;cloneBirths=s.cloneBirths||0;
  maxGen=s.maxGen;iceUntil=s.iceUntil??-1;lastSpeciesN=s.lastSpeciesN||1;
  foodRate=s.foodRate;mutRate=s.mutRate;foodEl.value=foodRate;radEl.value=mutRate;syncDials();
  for(const k in hist)hist[k]=(s.hist&&Array.isArray(s.hist[k]))?s.hist[k]:[];
  lastSample=simT-1;lastHud=simT-1;lastSpeciesMsgT=simT;selected=null;extinctAt=-1;
  initSnow();
  const away=(Date.now()-s.savedAt)/1000;
  if(away>90){
    catchupLeft=Math.floor(clamp(away,0,480))*60;
    cuB0=births;cuD0=deaths;cuG0=maxGen;
    say('the dish stirs from sleep. you were away '+(away>5400?Math.round(away/3600)+'h':Math.round(away/60)+'m'));
  }else catchupLeft=0;
  return true;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&worldReady&&catchupLeft<=0)saveWorld();});
window.addEventListener('pagehide',()=>{if(worldReady)saveWorld();});

// ---------- main loop ----------
let lastT=performance.now(),acc=0;
function frame(){
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000,0.1); lastT=now;
  if(!worldReady){
    resize();
    if(R>80&&W>200){initCharts();if(!loadWorld())initWorld();worldReady=true;}
    else{ctx.fillStyle='#050A14';ctx.fillRect(0,0,W,H);requestAnimationFrame(frame);return;}
  }
  if(!paused){
    if(catchupLeft>0){
      const burst=Math.min(20,catchupLeft);
      for(let i=0;i<burst;i++)step(1/60);
      catchupLeft-=burst; sample(); acc=0;
      if(catchupLeft<=0)say('⏩ while you slept: '+(births-cuB0)+' born, '+(deaths-cuD0)+' died'+(maxGen>cuG0?', now gen '+maxGen:''));
    }else{
      acc+=dt*speedMult;
      let guard=0;
      while(acc>=1/60&&guard<12){step(1/60);guard++;acc-=1/60;}
      if(guard>=12)acc=0;
      sample();
    }
  }
  if((catchupLeft>0)!==hintCU){hintCU=catchupLeft>0;
    $('hint').textContent=hintCU?'⏩ THE DISH KEPT LIVING · CATCHING UP':'CLICK A CELL TO INSPECT';}
  const nowMs=performance.now();
  if(worldReady&&catchupLeft<=0&&nowMs-lastSaveT>5000){saveWorld();lastSaveT=nowMs;}
  render();
  updateHud();
  const ib=$('btnIce');
  if(simT<iceUntil){ib.disabled=true;ib.textContent='❄️ '+Math.ceil(iceUntil-simT)+'s';}
  else{ib.disabled=false;ib.textContent='❄️ ice age';}
  requestAnimationFrame(frame);
}
syncDials();
ctx.fillStyle='#050A14';ctx.fillRect(0,0,W,H);
frame();
if(location.protocol.indexOf('http')===0&&'serviceWorker' in navigator){
  try{navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){}
}
</script>
